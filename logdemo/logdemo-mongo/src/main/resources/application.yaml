# 日志服务 MongoDB 版。带账号密码的连接串不写在这里：部署时由 Docker secret 中的私密配置文件提供
# （--spring.config.additional-location=file:/run/secrets/lab4-mongo.properties，
#   内容形如 spring.data.mongodb.uri=mongodb://lab4app:<密码>@lab4_mongo:27017/lab4_log?authSource=lab4_log）。
server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: logdemo-mongo
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:127.0.0.1}:${MONGO_PORT:27017}/${MONGO_DATABASE:lab4_log}
      # 索引由 db/mongo/01-init.js 创建，程序不自动建索引
      auto-index-creation: false

logdemo:
  pool:
    max-size: 100
    wait-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      impl: mongo
    distribution:
      percentiles-histogram:
        http.server.requests: true
    mongo:
      # MySQL 版没有逐条语句计时，为保持两边监控开销一致，关闭 Mongo 命令计时，只保留连接池指标
      command:
        enabled: false

logging:
  level:
    root: INFO
