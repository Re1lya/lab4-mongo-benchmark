# 实验四用到的 Prometheus 抓取配置（服务器 D：CDWY4 的 /root/prometheus/prometheus.yml）。
# 本组的 Prometheus 由实验三部署、开启了 basic auth，服务器上的文件还保留实验三的抓取任务和记录规则；
# 实验四只在其中新增下面的 lab4-* 两个任务，并把 CDWY5 加入 node 任务。修改后：
#   docker exec <prometheus 容器> promtool check config /etc/prometheus/prometheus.yml
#   docker kill -s HUP <prometheus 容器>      # 热加载，不重启
global:
  scrape_interval: 2s
  evaluation_interval: 5s
  scrape_timeout: 1s

scrape_configs:
  # 5 台服务器的 node-exporter（Swarm 全局服务，端口 9100）：CPU、内存、磁盘、网络
  - job_name: 'node'
    static_configs:
      - targets: ['172.31.1.202:9100', '172.31.8.46:9100', '172.31.12.156:9100', '172.31.1.19:9100', '172.31.13.151:9100']

  # 两套日志服务：CDWY1 上 host 模式发布的端口，与 JMeter 访问的地址相同。
  # 不用 Swarm 服务名 lab4_logjpa：名字里的下划线不是合法主机名，Tomcat 会对这样的 Host 头直接返回 400。
  # 指标自带 application、impl（jpa/mongo）标签，这里不再加同名标签。
  # 压测时 CPU 很忙，抓取超时放宽到 2s，避免高负载时缺数据。
  - job_name: 'lab4-logjpa'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ['172.31.1.202:8081']
  - job_name: 'lab4-logmongo'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ['172.31.1.202:8082']
