# CDWY4 /root/prometheus/prometheus.yml（实验三配置 + 实验四新增的抓取任务）
# 修改后：docker exec <prometheus 容器> promtool check config /etc/prometheus/prometheus.yml
#        docker kill -s HUP <prometheus 容器>      # 热加载，不重启
global:
  scrape_interval: 2s # 默认抓取间隔
  evaluation_interval: 5s # 默认评估间隔
  scrape_timeout: 1s # 默认抓取超时时间

# 规则文件配置
rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    basic_auth:
      username: admin
      password_file: /etc/prometheus/self-scrape-password
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'productdemoaop'
    metrics_path: '/actuator/prometheus'
    scrape_timeout: 1s # 抓取超时时间
    scrape_interval: 2s # 抓取间隔（避免过于频繁）
    static_configs:
      - targets: ['productdemoaop:8080']
  - job_name: 'node'
    static_configs:
      # 实验四新增 172.31.13.151（CDWY5，MongoDB 服务器）
      - targets: ['172.31.1.202:9100', '172.31.8.46:9100', '172.31.12.156:9100', '172.31.1.19:9100', '172.31.13.151:9100']

  # ---------- 实验四：两套日志服务（CDWY1 上 host 模式发布的端口，与 JMeter 访问的地址相同）----------
  # 不用 Swarm 服务名 lab4_logjpa：名字里的下划线不是合法主机名，Tomcat 会对这样的 Host 头直接返回 400。
  # 指标自带 application、impl（jpa/mongo）标签，这里不再加同名标签。
  # 压测时 CPU 很忙，抓取超时放宽到 2s，避免高负载时缺数据。
  - job_name: 'lab4-logjpa'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ['172.31.1.202:8081']
  - job_name: 'lab4-logmongo'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ['172.31.1.202:8082']
